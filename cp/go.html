<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Claude Code 起動</title>
<style>
:root{--navy:#0D1F4E;--gold:#C9A84C;--bg:#f2f4f1;--ink:#1c232a;--sub:#5c6772;--line:#dde1d9;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;font-size:15px;line-height:1.7;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px;}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;max-width:560px;width:100%;padding:28px 28px 24px;box-shadow:0 6px 24px rgba(13,31,78,.08);}
h1{font-size:15px;letter-spacing:.14em;color:var(--navy);margin:0 0 14px;display:flex;align-items:center;gap:10px;}
h1 .mark{width:26px;height:26px;border-radius:6px;background:var(--navy);color:var(--gold);display:inline-flex;align-items:center;justify-content:center;font-size:14px;}
#msg{font-size:13px;color:var(--sub);margin:0 0 8px;}
pre{background:#f6f8f5;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;white-space:pre-wrap;word-break:break-word;max-height:180px;overflow:auto;margin:0 0 16px;font-family:ui-monospace,Menlo,monospace;}
.btn{display:block;width:100%;text-align:center;background:var(--navy);color:#fff;font-weight:700;font-size:16px;border:none;border-radius:8px;padding:14px;cursor:pointer;text-decoration:none;margin-bottom:8px;}
.btn:hover{opacity:.9}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);font-size:13px;padding:10px;}
.mini{font-size:11.5px;color:var(--sub);margin:12px 0 0;}
</style>
</head>
<body>
<div class="box">
  <h1><span class="mark">⚡</span>COCKPIT → CLAUDE CODE</h1>
  <p id="msg">読み込み中…</p>
  <pre id="pr" hidden></pre>
  <a id="go" class="btn" hidden>⚡ Claude Code を開く</a>
  <button id="copy" class="btn ghost" hidden>プロンプトをコピー</button>
  <p class="mini">開いたターミナルで内容を確認して Enter で実行。うまく開かない場合はコピーして Claude Code に貼ればOK。指示はCockpitのInboxにも記録済みなので、ここで実行しなくても毎時（9〜21時）の巡回が拾います。</p>
</div>
<script>
(function(){
  var msg=document.getElementById('msg'),prEl=document.getElementById('pr'),go=document.getElementById('go'),cp=document.getElementById('copy');
  var link='';
  try{link=decodeURIComponent((location.hash||'').slice(1));}catch(e){}
  if(!link||link.indexOf('claude-cli://open?')!==0){
    msg.textContent='指示がありません。CockpitのClaudeに指示欄から「⚡今すぐ実行」で開いてください。';
    return;
  }
  var q='';
  var m=link.split('&q=');
  if(m[1]){try{q=decodeURIComponent(m[1]);}catch(e){q=m[1];}}
  msg.textContent='この指示でこのMacのClaude Codeを起動します：';
  prEl.textContent=q||link; prEl.hidden=false;
  go.href=link; go.hidden=false; cp.hidden=false;
  cp.onclick=function(){
    (navigator.clipboard?navigator.clipboard.writeText(q):Promise.reject()).then(
      function(){cp.textContent='コピーしました → Claude Codeに貼る';},
      function(){cp.textContent='コピー失敗：上の枠から手動で選択コピー';});
  };
  // 自動起動を1回試す（ブラウザにブロックされたらボタンで開く）
  setTimeout(function(){try{location.href=link;}catch(e){}},350);
})();
</script>
</body>
</html>
